<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphics control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1014; color: #e8eaee; font: 15px/1.4 'Segoe UI', system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 20px; }
  h2 { margin: 6px 0 0; padding-top: 14px; border-top: 1px solid #2c323d; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9ba4b4; }
  label { display: grid; gap: 6px; font-size: 13px; color: #9ba4b4; }
  label .value { color: #e8eaee; }
  .label-row { display: flex; justify-content: space-between; }
  input, select { font: inherit; color: #e8eaee; background: #171a21; border: 1px solid #2c323d; border-radius: 8px; padding: 9px 11px; min-width: 0; }
  input[type='range'] { padding: 0; accent-color: #4c8dff; background: transparent; border: 0; height: 28px; }
  input[type='color'] { width: 100%; height: 40px; padding: 3px; }
  small { font-size: 12px; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; font-weight: 600; min-height: 52px; border-radius: 8px; border: 1px solid #2c323d; background: #1b1f27; color: #e8eaee; cursor: pointer; }
  button.show { background: #3fb37f; border-color: #3fb37f; color: #08170f; font-weight: 700; }
  .styles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .styles button { min-height: 0; padding: 6px; font-size: 12px; font-weight: 500; display: grid; gap: 5px; }
  .styles button[aria-checked='true'] { background: #1d2a44; border-color: #4c8dff; }
  .thumb { height: 36px; border-radius: 4px; position: relative; overflow: hidden; }
  .thumb span { position: absolute; }
  .state { font-size: 14px; color: #9ba4b4; margin: 0; }
  .state b { color: #e8eaee; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Lower third</h1>
  <label>Name <input id="name" maxlength="80"></label>
  <label>Title <input id="title" maxlength="120"></label>
  <div class="buttons">
    <button class="show" id="show">Show</button>
    <button id="hide">Hide</button>
  </div>
  <p class="state" id="state" role="status">Connecting…</p>
  <p class="state" id="addr"></p>

  <h2>Look</h2>
  <div class="styles" role="radiogroup" aria-label="Style">
    <button type="button" role="radio" data-style="classic">
      <span class="thumb" style="background:#2b3038"><span style="left:6px;bottom:8px;width:36px;height:8px;background:#f2f2f2"></span><span style="left:6px;bottom:3px;width:42px;height:5px;background:#2563d9"></span></span>Classic</button>
    <button type="button" role="radio" data-style="block">
      <span class="thumb" style="background:#33291f"><span style="left:6px;bottom:4px;width:44px;height:13px;background:#0c0e12;border-left:3px solid #2563d9"></span></span>Bold block</button>
    <button type="button" role="radio" data-style="minimal">
      <span class="thumb" style="background:#24302e"><span style="left:6px;bottom:11px;width:34px;height:5px;background:#fff"></span><span style="left:6px;bottom:7px;width:12px;height:2px;background:#2563d9"></span></span>Minimal</button>
    <button type="button" role="radio" data-style="news">
      <span class="thumb" style="background:#2a2a38"><span style="left:0;right:0;bottom:5px;height:9px;background:#f5f6f8;border-left:10px solid #2563d9"></span></span>News strip</button>
  </div>

  <div class="two">
    <label>Font
      <select id="font">
        <option value="Inter">Inter</option>
        <option value="Space Grotesk">Space Grotesk</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Roboto Slab">Roboto Slab</option>
        <option value="custom">A font on the streaming PC…</option>
      </select>
    </label>
    <label>Position
      <select id="position">
        <option value="left">Bottom left</option>
        <option value="center">Bottom centre</option>
        <option value="right">Bottom right</option>
      </select>
    </label>
  </div>
  <label id="customRow" class="hidden">Font name (as installed on the streaming PC)
    <input id="customFont" maxlength="60" placeholder="e.g. Arial Black">
  </label>

  <label><span class="label-row">Name size <span class="value" id="nameSizeV"></span></span>
    <input type="range" id="nameSize" min="20" max="120">
  </label>
  <label><span class="label-row">Title size <span class="value" id="titleSizeV"></span></span>
    <input type="range" id="titleSize" min="12" max="80">
  </label>
  <label><span class="label-row">Length <span class="value" id="lengthV"></span></span>
    <input type="range" id="length" min="0" max="100">
    <small>All the way left: as long as the words. Further right: a fixed length, up to the full width.</small>
  </label>

  <div class="three">
    <label>Accent <input type="color" id="accent"></label>
    <label id="boxRow">Box <input type="color" id="box"></label>
    <label>Text <input type="color" id="text"></label>
  </div>

  <div class="two">
    <label>Stays on for
      <select id="stayFor">
        <option value="0">Until I press Hide</option>
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
        <option value="20">20 seconds</option>
        <option value="30">30 seconds</option>
      </select>
    </label>
    <label>Animation
      <select id="animation">
        <option value="slide">Slide in</option>
        <option value="fade">Fade</option>
        <option value="wipe">Wipe</option>
      </select>
    </label>
  </div>
  <small style="color:#9ba4b4">Changes show on the stream straight away. The look is saved, so it is the same next time.</small>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  const send = (change) =>
    fetch('/api/graphics', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(change) })

  /** Colours each style starts with when you pick it (you can change them after). */
  const STYLE_COLORS = {
    classic: { box: '#f2f2f2', text: '#111111' },
    block: { box: '#0c0e12', text: '#ffffff' },
    minimal: { box: '#000000', text: '#ffffff' },
    news: { box: '#f5f6f8', text: '#111111' }
  }

  let look = null
  let timer = null
  /** Send a look change, a moment after the last slider move (not on every pixel). */
  function setLook(change, now = false) {
    look = { ...look, ...change }
    render()
    clearTimeout(timer)
    timer = setTimeout(() => {
      timer = null
      void send({ look })
    }, now ? 0 : 120)
  }

  function render() {
    for (const b of document.querySelectorAll('[data-style]')) b.setAttribute('aria-checked', String(b.dataset.style === look.style))
    for (const k of ['font', 'position', 'customFont', 'nameSize', 'titleSize', 'length', 'accent', 'box', 'text', 'stayFor', 'animation']) {
      const input = $(k)
      if (document.activeElement !== input) input.value = look[k]
    }
    $('nameSizeV').textContent = `${look.nameSize} px`
    $('titleSizeV').textContent = `${look.titleSize} px`
    $('lengthV').textContent = look.length > 0 ? `${look.length}% of the width` : 'Fits the words'
    $('customRow').classList.toggle('hidden', look.font !== 'custom')
    $('boxRow').classList.toggle('hidden', look.style === 'minimal')
  }

  for (const b of document.querySelectorAll('[data-style]')) b.onclick = () => setLook({ style: b.dataset.style, ...STYLE_COLORS[b.dataset.style] }, true)
  for (const k of ['font', 'position', 'stayFor', 'animation']) $(k).onchange = () => setLook({ [k]: k === 'stayFor' ? Number($(k).value) : $(k).value }, true)
  for (const k of ['nameSize', 'titleSize', 'length']) $(k).oninput = () => setLook({ [k]: Number($(k).value) })
  for (const k of ['accent', 'box', 'text']) $(k).oninput = () => setLook({ [k]: $(k).value })
  $('customFont').oninput = () => setLook({ customFont: $('customFont').value })

  $('show').onclick = () => send({ show: true, name: $('name').value, title: $('title').value })
  $('hide').onclick = () => send({ show: false })

  // The address to type into the streaming app ("Graphics (network)" source).
  fetch('/api/info').then((r) => r.json()).then((info) => {
    const host = info.addresses[0] || location.hostname
    $('addr').textContent = 'Add to the streaming app: '
    const b = document.createElement('b')
    b.textContent = `http://${host}:${info.port}/live`
    $('addr').append(b)
  }).catch(() => {})

  // Show what is on the graphics now (the same messages the graphics page gets).
  let filled = false
  new EventSource('/events').onmessage = (e) => {
    const g = JSON.parse(e.data)
    if (!filled) {
      $('name').value = g.name
      $('title').value = g.title
      filled = true
    }
    if (!look || !timer) look = g.look
    render()
    $('state').textContent = ''
    const b = document.createElement('b')
    b.textContent = g.show ? `Showing: ${g.name}` : 'Hidden'
    $('state').append('Graphics now: ', b)
  }
</script>
</body>
</html>
